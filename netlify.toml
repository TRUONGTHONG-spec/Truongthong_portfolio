[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"

[[redirects]]
  from = "/cms-content.json"
  to = "https://truongthong-cms.netlify.app/content"
  status = 200
  force = true
[[redirects]]
  from = "/project-:slug.html"
  to = "/project.html?slug=:slug"
  status = 200
  force = true
[[redirects]]
  from = "/project-:slug"
  to = "/project.html?slug=:slug"
  status = 200
  force = true
[[redirects]]
  from = "/editor.html"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/editor"
  to = "/404.html"
  status = 404
  force = true
